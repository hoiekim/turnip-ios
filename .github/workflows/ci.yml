name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      # Matches the Xcode version CONTRIBUTING.md documents as the dev baseline.
      # XcodeGen's emitted project format tracks its own release, not the
      # selected Xcode, so this must stay new enough to open it — see
      # https://github.com/yonaskolb/XcodeGen/issues/1578.
      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Install XcodeGen and CocoaPods
        run: brew install xcodegen cocoapods

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve CocoaPods dependencies
        run: pod install

      - name: Build
        run: |
          xcodebuild build \
            -workspace Turnip.xcworkspace \
            -scheme Turnip \
            -destination "platform=iOS Simulator,name=iPhone 17"

      - name: Test
        run: |
          xcodebuild test \
            -workspace Turnip.xcworkspace \
            -scheme Turnip \
            -destination "platform=iOS Simulator,name=iPhone 17"
